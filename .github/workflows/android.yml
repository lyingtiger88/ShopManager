name: Build ShopManager - Windows + Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and report dependencies
        run: python -m pip install --upgrade pip pyinstaller reportlab pillow arabic-reshaper python-bidi
      - name: Check Python syntax
        run: python -m py_compile shopmanager.py
      - name: Test inventory and invoice logic
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Build single-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --hidden-import=arabic_reshaper --hidden-import=bidi.algorithm --hidden-import=PIL --add-data "device_catalog.json;." --name ShopManager shopmanager.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build updateable Windows installer (fixed AppId)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMySourceDir="${{ github.workspace }}\dist" /DMyOutputDir="${{ github.workspace }}\artifacts" /DMyAppVersion="0.1.${{ github.run_number }}" installer\ShopManager.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path artifacts/ShopManager-Setup-x64.exe)) { throw "Installer missing" }
      - name: Prepare persistent BDFR signing certificate
        shell: pwsh
        timeout-minutes: 1
        env:
          PFX_BASE64: ${{ secrets.BDFR_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.BDFR_CODESIGN_PFX_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ secrets.BDFR_CODESIGN_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("PFX_BASE64", "PFX_PASSWORD", "EXPECTED_THUMBPRINT")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required signing secret $name is missing." }
          }
          $pfxBytes = [Convert]::FromBase64String($env:PFX_BASE64)
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxBytes, $env:PFX_PASSWORD, $flags)
          if (-not $cert.HasPrivateKey) { throw "PFX does not contain a private key." }
          if ($cert.Thumbprint -ne $env:EXPECTED_THUMBPRINT) { throw "PFX thumbprint mismatch." }
          New-Item -ItemType Directory -Force artifacts/signing | Out-Null
          [IO.File]::WriteAllBytes("artifacts/signing/BDFR-CodeSigning.cer", $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $pfxPath = Join-Path $env:RUNNER_TEMP "BDFR-CodeSigning.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          "BDFR_CODESIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BDFR_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BDFR signing certificate prepared; thumbprint verified."
      - name: Sign and verify ShopManager Windows executable and installer
        shell: pwsh
        timeout-minutes: 5
        env:
          PFX_PASSWORD: ${{ secrets.BDFR_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path $env:BDFR_PFX_PATH)) { throw "Prepared BDFR PFX is missing." }
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK SignTool not found." }
          $files = @(Get-Item "dist/ShopManager.exe", "artifacts/ShopManager-Setup-x64.exe")
          foreach ($file in $files) {
            & $sdk.FullName sign /f "$env:BDFR_PFX_PATH" /p "$env:PFX_PASSWORD" /fd SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "SignTool failed: $($file.Name)" }
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $env:BDFR_CODESIGN_THUMBPRINT) { throw "Wrong BDFR signer on $($file.Name)." }
            $expectedUntrustedRoot = $signature.Status -eq "UnknownError" -and $signature.StatusMessage -match "root certificate which is not trusted"
            if ($signature.Status -ne "Valid" -and -not $expectedUntrustedRoot) { throw "Authenticode validation failed for $($file.Name): $($signature.Status) $($signature.StatusMessage)" }
            if ($expectedUntrustedRoot) { Write-Warning "Correct BDFR signature; self-signed root is not trusted on hosted runner." }
          }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } | ForEach-Object { "$($_.Hash) *$($_.Path)" } | Set-Content artifacts/signing/SHA256SUMS.txt
          Remove-Item $env:BDFR_PFX_PATH -Force
          Write-Host "ShopManager Windows EXE and installer signed with persistent BDFR identity."
      - name: Upload in-place Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-Windows-Installer
          path: |
            artifacts/ShopManager-Setup-x64.exe
            artifacts/signing/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-Windows
          path: |
            dist/ShopManager.exe
            artifacts/signing/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows EXE in GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "windows-latest"
          # Recreate the mutable rolling release to avoid stale upload asset endpoints.
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release create $tag "dist/ShopManager.exe" "artifacts/ShopManager-Setup-x64.exe" --repo $env:GH_REPO --target "${{ github.sha }}" --title "ShopManager - Windows Latest" --notes "Latest successfully built Windows executable for ShopManager." --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and assemble Android
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug
      - name: Copy and validate test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK_SIZE_BYTES=$SIZE" >> "$GITHUB_ENV"
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 102400 ]; then
            echo "APK is suspiciously small (<100 KiB); refusing to publish."
            exit 1
          fi
          cp "$APK" out/ShopManager-Android-Test.apk
          sha256sum out/ShopManager-Android-Test.apk | tee out/SHA256SUMS.txt
      - name: Upload APK to Actions test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-Android-Test
          path: out/ShopManager-Android-Test.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish test APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view android-test --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create android-test --repo "$GH_REPO" --target "${{ github.sha }}" --title "ShopManager Android - Test" --notes "Android test APK for paired LAN synchronization with Windows master. Not a production-signed build." --prerelease
          fi
          gh release upload android-test out/ShopManager-Android-Test.apk --clobber --repo "$GH_REPO"
