name: Android - Test and Publish APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'sync_server.py'
      - 'shopmanager.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and assemble Android
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug
      - name: Copy test APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ShopManager-Android-Test.apk
      - name: Upload APK to Actions test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-Android-Test
          path: out/ShopManager-Android-Test.apk
          if-no-files-found: error
      - name: Publish test APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view android-test --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create android-test --repo "$GH_REPO" --target "${{ github.sha }}" --title "ShopManager Android - Test" --notes "Android test APK for paired LAN synchronization with Windows master. Not a production-signed build." --prerelease
          fi
          gh release upload android-test out/ShopManager-Android-Test.apk --clobber --repo "$GH_REPO"
