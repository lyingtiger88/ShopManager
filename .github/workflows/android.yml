name: Build ShopManager - Windows + Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Check Python syntax
        run: python -m py_compile shopmanager.py
      - name: Test inventory and invoice logic
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Build single-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "device_catalog.json;." --name ShopManager shopmanager.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-Windows
          path: dist/ShopManager.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows EXE in GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "windows-latest"
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GH_REPO --target "${{ github.sha }}" --title "ShopManager - Windows Latest" --notes "Latest successfully built Windows executable for ShopManager." --latest
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag "dist/ShopManager.exe" --clobber --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { exit 1 }

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and assemble Android
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug
      - name: Copy test APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ShopManager-Android-Test.apk
      - name: Upload APK to Actions test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-Android-Test
          path: out/ShopManager-Android-Test.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish test APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view android-test --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create android-test --repo "$GH_REPO" --target "${{ github.sha }}" --title "ShopManager Android - Test" --notes "Android test APK for paired LAN synchronization with Windows master. Not a production-signed build." --prerelease
          fi
          gh release upload android-test out/ShopManager-Android-Test.apk --clobber --repo "$GH_REPO"
