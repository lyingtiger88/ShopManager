name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Check Python syntax
        run: python -m py_compile shopmanager.py
      - name: Test inventory and invoice logic
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Build single-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "device_catalog.json;." --name ShopManager shopmanager.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-Windows
          path: dist/ShopManager.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows EXE in Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "windows-latest"
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GH_REPO --target "${{ github.sha }}" --title "ShopManager - Windows Latest" --notes "Latest successfully built Windows executable for ShopManager. Download ShopManager.exe below." --latest
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag "dist/ShopManager.exe" --clobber --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { exit 1 }
