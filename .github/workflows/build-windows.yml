name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Check Python syntax
        run: python -m py_compile shopmanager.py
      - name: Test inventory and invoice logic
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Build single-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ShopManager shopmanager.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-Windows
          path: dist/ShopManager.exe
          if-no-files-found: error
          retention-days: 30
