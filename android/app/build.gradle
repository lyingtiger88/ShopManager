plugins { id 'com.android.application' }
android {
    namespace 'com.shopmanager.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shopmanager.mobile'
        minSdk 24
        targetSdk 28
        versionCode (project.findProperty('SHOPMANAGER_VERSION_CODE') ?: '1').toString().toInteger()
        versionName (project.findProperty('SHOPMANAGER_VERSION_NAME') ?: '0.1.0').toString()
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    def releaseKeystore = System.getenv('SHOPMANAGER_ANDROID_KEYSTORE_PATH')
    def storePassword = System.getenv('SHOPMANAGER_ANDROID_STORE_PASSWORD')
    def keyAlias = System.getenv('SHOPMANAGER_ANDROID_KEY_ALIAS')
    def keyPassword = System.getenv('SHOPMANAGER_ANDROID_KEY_PASSWORD')
    def releaseReady = [releaseKeystore, storePassword, keyAlias, keyPassword].every {
        it != null && !it.trim().isEmpty()
    }
    if (releaseReady) {
        signingConfigs {
            kaliiaRelease {
                storeFile file(releaseKeystore)
                storePassword storePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseReady) signingConfig signingConfigs.kaliiaRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
